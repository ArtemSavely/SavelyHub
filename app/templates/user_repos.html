{% extends "base.html" %}

{% block content %}
<h2 id="log">Repos</h2>
<a href="{{ url_for('web.create_repository') }}">
    <button class="new_repo_btn">Create New</button>
</a>
{% for repo in user.repositories%}
<div class="repo_card">
    <a href="{{ url_for('web.repository', username=user.username, repo=repo.name) }}">
        <h2>{{ repo.name }}</h2>
    </a>
</div>
{% endfor %}

{% endblock %}
